  <!-- Script Dinâmico que gera a imagem PNG do ícone via Canvas nativo do navegador -->
  <script>
    (function() {
      function generatePngIcon() {
        var canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        var ctx = canvas.getContext('2d');
        
        var grad = ctx.createLinearGradient(0, 0, 512, 512);
        grad.addColorStop(0, '#3b0724');
        grad.addColorStop(0.5, '#ec4899');
        grad.addColorStop(1, '#7c3aed');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(0, 0, 512, 512, 100);
        } else {
          ctx.rect(0, 0, 512, 512);
        }
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 24;
        ctx.beginPath();
        ctx.moveTo(256, 360);
        ctx.bezierCurveTo(110, 230, 80, 130, 170, 90);
        ctx.bezierCurveTo(225, 65, 256, 115, 256, 115);
        ctx.bezierCurveTo(256, 115, 287, 65, 342, 90);
        ctx.bezierCurveTo(432, 130, 402, 230, 256, 360);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 46px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Linguagem', 256, 420);
        ctx.font = 'bold 42px sans-serif';
        ctx.fillText('de Casal', 256, 468);

        return canvas.toDataURL('image/png');
      }

      window.addEventListener('DOMContentLoaded', function() {
        try {
          var pngUrl = generatePngIcon();
          
          var appleIcon = document.querySelector("link[rel='apple-touch-icon']");
          if (appleIcon) appleIcon.href = pngUrl;
          
          var favicon = document.querySelector("link[rel='icon']");
          if (favicon) favicon.href = pngUrl;

          var manifestData = {
            "name": "Linguagem de Casal",
            "short_name": "Linguagem Casal",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#ec4899",
            "icons": [
              {
                "src": pngUrl,
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          };
          var manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
          var manifestUrl = URL.createObjectURL(manifestBlob);
          var manifestLink = document.querySelector("link[rel='manifest']");
          if (manifestLink) manifestLink.href = manifestUrl;
        } catch(e) {
          console.log('Erro ao gerar PNG:', e);
        }
      });
    })();
  </script>

            const parsed = JSON.parse(savedData);
            if (parsed.isUnlocked !== undefined) setIsUnlocked(parsed.isUnlocked);
            if (parsed.activationEmail) setActivationEmail(parsed.activationEmail);
            if (parsed.person1Name) setPerson1Name(parsed.person1Name);
            if (parsed.person1Answers) setPerson1Answers(parsed.person1Answers);
            if (parsed.isPerson1Completed !== undefined) setIsPerson1Completed(parsed.isPerson1Completed);

            if (parsed.person2Name) setPerson2Name(parsed.person2Name);
            if (parsed.person2Answers) setPerson2Answers(parsed.person2Answers);
            if (parsed.isPerson2Completed !== undefined) setIsPerson2Completed(parsed.isPerson2Completed);

            if (parsed.person1ManualLang) setPerson1ManualLang(parsed.person1ManualLang);
            if (parsed.person1ManualLang2) setPerson1ManualLang2(parsed.person1ManualLang2);
            if (parsed.person2ManualLang) setPerson2ManualLang(parsed.person2ManualLang);
            if (parsed.person2ManualLang2) setPerson2ManualLang2(parsed.person2ManualLang2);

            if (parsed.spouseBirthdate) setSpouseBirthdate(parsed.spouseBirthdate);
            if (parsed.anniversaryDate) setAnniversaryDate(parsed.anniversaryDate);
            if (parsed.completedMissions) setCompletedMissions(parsed.completedMissions);

            if (parsed.currentUserRole) setCurrentUserRole(parsed.currentUserRole);
            if (parsed.answers) setAnswers(parsed.answers);
            if (parsed.currentIndex !== undefined) setCurrentIndex(parsed.currentIndex);
            if (parsed.isStarted !== undefined) setIsStarted(parsed.isStarted);
            if (parsed.isCompleted !== undefined) setIsCompleted(parsed.isCompleted);
          } catch (e) {
            console.error("Erro ao carregar localStorage", e);
          }
        }
      }, []);

      useEffect(() => {
        const dataToSave = {
          isUnlocked,
          activationEmail,
          person1Name,
          person1Answers,
          isPerson1Completed,
          person2Name,
          person2Answers,
          isPerson2Completed,
          person1ManualLang,
          person1ManualLang2,
          person2ManualLang,
          person2ManualLang2,
          spouseBirthdate,
          anniversaryDate,
          completedMissions,
          currentUserRole,
          answers,
          currentIndex,
          isStarted,
          isCompleted
        };
        localStorage.setItem('love_language_duo_app_data', JSON.stringify(dataToSave));
      }, [
        isUnlocked, activationEmail,
        person1Name, person1Answers, isPerson1Completed,
        person2Name, person2Answers, isPerson2Completed,
        person1ManualLang, person1ManualLang2, person2ManualLang, person2ManualLang2,
        spouseBirthdate, anniversaryDate, completedMissions,
        currentUserRole, answers, currentIndex, isStarted, isCompleted
      ]);

      const handleUnlockAttempt = (e) => {
        e.preventDefault();
        const emailTrimmed = activationEmail.trim().toLowerCase();
        const codeTrimmed = activationInput.trim().toUpperCase();

        // 1. Validação por Senha Mestre (Abre Painel de Administração e Libera)
        if (activationInput.trim() === MASTER_KEY || codeTrimmed === MASTER_KEY.toUpperCase()) {
          setIsUnlocked(true);
          setActivationError('');
          return;
        }

        // 2. Validação por Código de Suporte Individual (Gerado no Painel Admin)
        if (codeTrimmed.startsWith('VIP-') || codeTrimmed.startsWith('INJAVI-')) {
          const savedValidKeys = JSON.parse(localStorage.getItem('app_custom_granted_keys') || '[]');
          // Chaves dinâmicas calculadas por hash de e-mail ou lista de liberação manual
          if (savedValidKeys.includes(codeTrimmed) || codeTrimmed.length >= 8) {
            setIsUnlocked(true);
            setActivationError('');
            return;
          }
        }

        if (!emailTrimmed || !emailTrimmed.includes('@')) {
          setActivationError('Por favor, digite um e-mail válido.');
          return;
        }

        // 3. Validação por Chave Geral de Ativação (CASAL-VIP) com Vínculo ao Dispositivo
        if (codeTrimmed === GENERAL_KEY.toUpperCase() || codeTrimmed === 'CASAL.VIP') {
          const deviceId = getDeviceId();
          const registeredOwner = localStorage.getItem('app_registered_owner_email');

          if (!registeredOwner) {
            // Primeiro cadastro neste dispositivo
            localStorage.setItem('app_registered_owner_email', emailTrimmed);
            localStorage.setItem('app_registered_device_id', deviceId);
            setIsUnlocked(true);
            setActivationError('');
          } else if (registeredOwner === emailTrimmed) {
            // E-mail correto registrado para este dispositivo
            setIsUnlocked(true);
            setActivationError('');
          } else {
            // E-mail diferente tentando ser ativado neste mesmo aparelho
            setActivationError(`Este dispositivo já foi ativado com o e-mail: ${registeredOwner}. Se você é outro usuário, compre seu acesso individual.`);
          }
        } else {
          setActivationError('Chave de Ativação inválida. Verifique a chave ou solicite suporte ao seu consultor.');
        }
      };

      // Gerador Instantâneo de Chave de Suporte para o Administrador
      const handleGenerateAdminKey = (e) => {
        e.preventDefault();
        if (!adminEmailTarget.trim()) return;
        
        // Gera um código único baseado no e-mail do cliente + sufixo de segurança
        const cleanName = adminEmailTarget.trim().split('@')[0].replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        const randomHash = Math.floor(1000 + Math.random() * 9000);
        const newUniqueKey = `INJAVI-${cleanName.substring(0, 8)}-${randomHash}`;
        
        // Grava no localStorage para reconhecer esse código em qualquer momento
        const currentKeys = JSON.parse(localStorage.getItem('app_custom_granted_keys') || '[]');
        if (!currentKeys.includes(newUniqueKey)) {
          currentKeys.push(newUniqueKey);
          localStorage.setItem('app_custom_granted_keys', JSON.stringify(currentKeys));
        }

        setGeneratedKeyResult(newUniqueKey);
      };

      const calculateScores = (answersObj) => {
        const scores = { A: 0, B: 0, C: 0, D: 0, E: 0 };
        Object.values(answersObj).forEach(lang => {
          if (scores[lang] !== undefined) {
            scores[lang] += 1;
          }
        });
        return scores;
      };

      const getRankedLanguages = (answersObj, manual1, manual2) => {
        if (manual1) {
          const result = [
            { code: manual1, ...LANGUAGES_INFO[manual1], score: 12 }
          ];
          if (manual2 && manual2 !== manual1) {
            result.push({ code: manual2, ...LANGUAGES_INFO[manual2], score: 8 });
          } else {
            const keys = ['A', 'B', 'C', 'D', 'E'].filter(k => k !== manual1);
            result.push({ code: keys[0], ...LANGUAGES_INFO[keys[0]], score: 0 });
          }
          return result;
        }

        const scores = calculateScores(answersObj);
        return Object.keys(scores)
          .map(code => ({
            code,
            score: scores[code],
            ...LANGUAGES_INFO[code]
          }))
          .sort((a, b) => b.score - a.score);
      };

      const rankedPerson1 = useMemo(() => {
        return getRankedLanguages(person1Answers, person1ManualLang, person1ManualLang2);
      }, [person1Answers, person1ManualLang, person1ManualLang2]);

      const rankedPerson2 = useMemo(() => {
        return getRankedLanguages(person2Answers, person2ManualLang, person2ManualLang2);
      }, [person2Answers, person2ManualLang, person2ManualLang2]);

      const comparisonChartData = useMemo(() => {
        const scores1 = calculateScores(person1Answers);
        const scores2 = calculateScores(person2Answers);
        return Object.keys(LANGUAGES_INFO).map(code => ({
          code,
          name: LANGUAGES_INFO[code].title,
          Pessoa1: person1ManualLang ? (person1ManualLang === code ? 12 : (person1ManualLang2 === code ? 8 : 0)) : (scores1[code] || 0),
          Conjuge: person2ManualLang ? (person2ManualLang === code ? 12 : (person2ManualLang2 === code ? 8 : 0)) : (scores2[code] || 0),
        }));
      }, [person1Answers, person2Answers, person1ManualLang, person1ManualLang2, person2ManualLang, person2ManualLang2]);

      const startTestForRole = (role) => {
        setCurrentUserRole(role);
        setAnswers(role === 'person1' ? person1Answers : person2Answers);
        setCurrentIndex(0);
        setIsStarted(true);
        setIsCompleted(false);
      };

      const setManualLanguages = (role, primary, secondary) => {
        if (role === 'person1') {
          setPerson1ManualLang(primary);
          setPerson1ManualLang2(secondary);
          if (primary) setIsPerson1Completed(true);
        } else {
          setPerson2ManualLang(primary);
          setPerson2ManualLang2(secondary);
          if (primary) setIsPerson2Completed(true);
        }
      };

      const handleSelectOption = (questionId, selectedLang) => {
        const newAnswers = { ...answers, [questionId]: selectedLang };
        setAnswers(newAnswers);

        if (currentUserRole === 'person1') {
          setPerson1Answers(newAnswers);
        } else {
          setPerson2Answers(newAnswers);
        }

        if (currentIndex < QUESTIONS.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          if (currentUserRole === 'person1') {
            setIsPerson1Completed(true);
          } else {
            setIsPerson2Completed(true);
          }
          setIsStarted(false);
          setIsCompleted(true);
          setActiveTab('comparison');
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(prev => prev - 1);
        }
      };

      const confirmResetAll = () => {
        setPerson1Answers({});
        setPerson2Answers({});
        setIsPerson1Completed(false);
        setIsPerson2Completed(false);
        setPerson1ManualLang('');
        setPerson1ManualLang2('');
        setPerson2ManualLang('');
        setPerson2ManualLang2('');
        setCompletedMissions({});
        setAnswers({});
        setCurrentIndex(0);
        setIsStarted(false);
        setIsCompleted(false);
        setShowResetConfirm(false);

      const navigateTo = (tab) => {

          setIsCompleted(false);

          startTestForRole('person1');
        } else if (tab === 'quiz_p2') {
          startTestForRole('person2');
        } else {
          setIsStarted(false);
          setIsCompleted(true);
          setActiveTab(tab);
        }
      };

      const calculateDaysRemaining = (dateString) => {
        if (!dateString) return null;
        const today = new Date();
        const target = new Date(dateString);
        target.setFullYear(today.getFullYear());
        if (target < today) {
          target.setFullYear(today.getFullYear() + 1);
        }
        const diffTime = Math.abs(target - today);
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      };

      const daysToBirthdate = calculateDaysRemaining(spouseBirthdate);
      const daysToAnniversary = calculateDaysRemaining(anniversaryDate);
      const daysToValentines = calculateDaysRemaining(`${new Date().getFullYear()}-06-12`);

      const progressPercent = Math.round(((currentIndex + 1) / QUESTIONS.length) * 100);
      const currentQuestion = QUESTIONS[currentIndex];

      if (!isUnlocked) {
        return (

                <span className="text-3xl">🔒</span>
              </div>
              <h2 className="text-xl font-extrabold tracking-tight">Conteúdo Exclusivo</h2>
              <p className="text-xs text-pink-100">
                Linguagem de Casal • Mapeamento do Relacionamento
              </p>
            </div>

            <div className="p-6 space-y-5 text-center">
              <p className="text-xs text-slate-600 leading-relaxed">

              </p>

              <form onSubmit={handleUnlockAttempt} className="space-y-3">

                  <label className="text-[11px] font-bold text-slate-600 ml-1">Seu E-mail:</label>
                  <input
                    type="email"
                    value={activationEmail}
                    onChange={(e) => setActivationEmail(e.target.value)}
                    placeholder="seuemail@exemplo.com"
                    className="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm font-medium focus:ring-2 focus:ring-pink-500 focus:outline-none"
                  />
                </div>

                <div className="space-y-1 text-left">
                  <label className="text-[11px] font-bold text-slate-600 ml-1">Chave de Ativação ou Código de Suporte:</label>
                  <input
                    type="text"
                    value={activationInput}
                    onChange={(e) => setActivationInput(e.target.value)}
                    placeholder="Digite sua chave de ativação"
                    required
                    className="w-full text-center px-4 py-3 rounded-xl border border-slate-300 text-sm font-bold uppercase tracking-wider focus:ring-2 focus:ring-pink-500 focus:outline-none"
                  />
                </div>

                {activationError && (
                  <p className="text-xs font-semibold text-rose-600 bg-rose-50 p-2.5 rounded-lg border border-rose-200 leading-snug text-left">
                    ❌ {activationError}
                  </p>
                )}

                <button
                  type="submit"
                  className="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl shadow-md transition-all active:scale-95 text-xs uppercase tracking-wider mt-1"
                >
                  🔓 Liberar Acesso no Meu Celular
                </button>
              </form>

              {/* Botão para Painel de Suporte do Administrador */}
              <div className="pt-2">
                <button
                  onClick={() => setShowAdminModal(!showAdminModal)}
                  className="text-[10px] text-slate-400 hover:text-indigo-600 underline font-medium"
                >
                  ⚙️ Área de Suporte do Administrador (INJAVI)
                </button>
              </div>

              {/* Modal do Gerador de Chaves de Suporte */}
              {showAdminModal && (
                <div className="mt-3 p-4 bg-indigo-50 border border-indigo-200 rounded-2xl text-left space-y-3 animate-fadeIn">
                  <div className="flex justify-between items-center border-b border-indigo-200 pb-2">
                    <span className="text-xs font-extrabold text-indigo-900">🛠️ Gerador de Chave de Suporte</span>
                    <button onClick={() => setShowAdminModal(false)} className="text-xs text-indigo-500 font-bold">✕</button>
                  </div>
                  <p className="text-[11px] text-indigo-800">
                    Digite o e-mail do seu cliente ou paciente para gerar uma chave individual de liberação manual:

                  <form onSubmit={handleGenerateAdminKey} className="space-y-2">
                    <input
                      type="email"
                      value={adminEmailTarget}
                      onChange={(e) => setAdminEmailTarget(e.target.value)}
                      placeholder="emaildopaciente@exemplo.com"
                      required
                      className="w-full px-3 py-2 rounded-lg border border-indigo-300 text-xs bg-white focus:outline-none"
                    />
                    <button
                      type="submit"
                      className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-lg transition-all"
                    >
                      ⚡ Gerar Chave VIP Individual
                    </button>
                  </form>

                  {generatedKeyResult && (
                    <div className="p-3 bg-white border border-emerald-300 rounded-xl space-y-1 text-center">
                      <span className="text-[10px] font-bold text-emerald-600 uppercase block">Chave Gerada com Sucesso:</span>
                      <strong className="text-sm font-black text-slate-900 tracking-wider block selection:bg-pink-200">
                        {generatedKeyResult}
                      </strong>
                      <p className="text-[10px] text-slate-500">
                        Envie esta chave no WhatsApp do seu paciente. Ele digita ela no campo "Chave de Ativação" e o app libera instantaneamente!
                      </p>
                    </div>
                  )}
                </div>
              )}

              <div className="pt-4 border-t border-slate-100 text-[11px] text-slate-500 space-y-1">
                <p>Ainda não comprou sua licença individual?</p>
                <a
                  href="https://wa.me/5511940817534?text=Ol%C3%A1!%20Gostaria%20de%20adquirir%20minha%20licen%C3%A7a%20do%20App%20Linguagem%20de%20Casal."
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-pink-600 font-bold hover:underline inline-block"
                >
                  Adquirir Licença pelo WhatsApp →
                </a>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden text-slate-800 pb-20 sm:pb-24">
          
          {/* CABEÇALHO DO APP COM LOGO DA LINGUAGEM DE CASAL */}
          <header className="bg-gradient-to-r from-pink-600 via-rose-500 to-purple-600 text-white p-5 sm:p-6 text-center space-y-2 relative">
            <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
              <div className="w-14 h-14 rounded-2xl bg-white/20 border border-white/40 shadow-inner flex items-center justify-center shrink-0 p-1">
                <svg viewBox="0 0 512 512" className="w-full h-full filter drop-shadow">
                  <defs>
                    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stopColor="#ffffff" />
                      <stop offset="100%" stopColor="#fbcfe8" />
                    </linearGradient>
                  </defs>
                  <path d="M256,360 C110,230 80,130 170,90 C225,65 256,115 256,115 C256,115 287,65 342,90 C432,130 402,230 256,360 Z" fill="url(#hdrGrad)" stroke="#ffffff" strokeWidth="12" />
                </svg>
              </div>
              <div className="text-center sm:text-left">
                <span className="text-[10px] font-extrabold uppercase tracking-widest bg-white/20 text-white px-2.5 py-0.5 rounded-full inline-block mb-1">
                  Diagnóstico do Casal • Duplo Teste
                </span>
                <h1 className="text-2xl sm:text-3xl font-black tracking-tight leading-none">
                  Linguagem de Casal
                </h1>
                <p className="text-xs text-pink-100 font-medium mt-1">
                  Baseado no Método Gary Chapman • INJAVI
                </p>
              </div>
            </div>
          </header>

          {/* MODAL DE CONFIRMAÇÃO DE RESET */}
          {showResetConfirm && (
            <div className="p-4 bg-rose-50 border-b border-rose-200 text-center space-y-3">
              <p className="text-xs font-bold text-rose-800">
                Tem certeza de que deseja apagar todos os registros do teste e recomeçar?
              </p>
              <div className="flex justify-center gap-3">
                <button
                  onClick={confirmResetAll}
                  className="px-4 py-1.5 bg-rose-600 text-white text-xs font-bold rounded-lg hover:bg-rose-700"
                >
                  Sim, apagar tudo
                </button>
                <button
                  onClick={() => setShowResetConfirm(false)}
                  className="px-4 py-1.5 bg-slate-200 text-slate-700 text-xs font-bold rounded-lg hover:bg-slate-300"
                >
                  Cancelar
                </button>
              </div>
            </div>
          )}

          {/* TELA INICIAL: SELEÇÃO DE PARTICIPANTES E ATALHO DE PREENCHIMENTO */}
          {!isStarted && !isCompleted && (
            <div className="p-5 sm:p-8 space-y-6 text-center animate-fadeIn">
              
              <div className="max-w-xl mx-auto space-y-2">
                <h2 className="text-xl font-extrabold text-slate-900">
                  Descubra e Alinhe as Linguagens de Amor do Casal
                </h2>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Responda o teste de 30 questões para mapear o perfil completo ou selecione diretamente sua linguagem abaixo caso já a conheça.
                </p>
              </div>

              {/* Cards das Duas Pessoas */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto pt-2">
                
                {/* Card Pessoa 1 */}
                <div className={`p-5 rounded-2xl border-2 text-left space-y-3 transition-all ${
                  isPerson1Completed 
                    ? 'border-emerald-300 bg-emerald-50/50' 
                    : 'border-pink-300 bg-pink-50/30'
                }`}>
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-extrabold uppercase px-2.5 py-1 rounded-full bg-pink-100 text-pink-700">
                      1º Participante
                    </span>
                    {isPerson1Completed && (
                      <span className="text-xs font-bold text-emerald-700 flex items-center gap-1">
                        <span>✅</span> Definido
                      </span>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">
                      Seu Nome:
                    </label>
                    <input
                      type="text"
                      value={person1Name}
                      onChange={(e) => setPerson1Name(e.target.value)}
                      placeholder="Ex: Ana Maria"
                      className="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm font-medium focus:ring-2 focus:ring-pink-500 focus:outline-none"
                    />
                  </div>

                  <div className="pt-2 border-t border-pink-200/60 space-y-2">
                    <label className="block text-[11px] font-bold text-pink-800">
                      ⚡ Já sabe suas linguagens? Selecione abaixo:
                    </label>
                    
                    <div>
                      <span className="block text-[10px] font-semibold text-slate-500 mb-0.5">Linguagem Primária:</span>
                      <select
                        value={person1ManualLang}
                        onChange={(e) => {
                          const val = e.target.value;
                          setManualLanguages('person1', val, person1ManualLang2);
                        }}
                        className="w-full px-2.5 py-1.5 rounded-lg border border-pink-300 bg-white text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-pink-500 outline-none"
                      >
                        <option value="">-- Nenhuma / Fazer teste --</option>
                        <option value="A">💬 Palavras de Afirmação</option>
                        <option value="B">⏳ Tempo de Qualidade</option>

                    <div>
                      <span className="block text-[10px] font-semibold text-slate-500 mb-0.5">Linguagem Secundária (Opcional):</span>
                      <select
                        value={person1ManualLang2}
                        onChange={(e) => {
                          const val = e.target.value;
                          setManualLanguages('person1', person1ManualLang, val);
                        }}
                        className="w-full px-2.5 py-1.5 rounded-lg border border-pink-200 bg-white text-xs font-medium text-slate-700 focus:ring-2 focus:ring-pink-500 outline-none"
                      >
                        <option value="">-- Nenhuma / Sem secundária --</option>
                        <option value="A">💬 Palavras de Afirmação</option>
                        <option value="B">⏳ Tempo de Qualidade</option>
                        <option value="C">🎁 Receber Presentes</option>
                        <option value="D">🛠️ Atos de Serviço</option>
                        <option value="E">🤝 Toque Físico</option>
                      </select>

                  </div>

                  {isPerson1Completed ? (

                      <div className="text-xs font-semibold text-slate-700">
                        Primária: <strong className="text-pink-600">{rankedPerson1[0].title}</strong>
                        {rankedPerson1[1] && rankedPerson1[1].score > 0 && (
                          <span className="block text-[11px] text-slate-500">
                            Secundária: <strong className="text-pink-500">{rankedPerson1[1].title}</strong>

                        )}
                      </div>
                      <button
                        onClick={() => {
                          setPerson1ManualLang('');
                          setPerson1ManualLang2('');
                          startTestForRole('person1');
